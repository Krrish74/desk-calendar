# wrangler.toml: how Cloudflare runs the Desk Calendar backend.
#
# ONE Worker does everything:
#   • serves the phone app's files from ../mobile (Workers "static assets")
#   • answers /auth/* (Google sign-in) and /api/* (calendar, quick add, assistant)
# Same address for app and API = the sign-in cookie is first-party and there's no CORS.
#
# Secrets are NOT in this file. Locally they go in worker/.dev.vars (git-ignored);
# in production you set them with `npx wrangler secret put NAME` (see SETUP-IPHONE.md).

name = "desk-calendar"
main = "src/index.js"
compatibility_date = "2026-11-01"

[assets]
directory = "../mobile"
binding = "ASSETS"
# Requests under these paths go to the Worker code; everything else is a static file.
run_worker_first = ["/api/*", "/auth/*"]

# D1 = Cloudflare's SQLite database. It holds the (encrypted) Google tokens, sign-in
# sessions, your settings, the assistant conversation and deletes waiting out "Undo".
# database_id is filled in after `npx wrangler d1 create desk-calendar` (SETUP-IPHONE.md).
# Local dev (`wrangler dev`) uses a local SQLite file and ignores the id.
[[d1_databases]]
binding = "DB"
database_name = "desk-calendar"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

# Runs every minute: finishes deletes whose Undo window passed (a backstop; normally
# they finish right after the window), and, from Phase 4, sends reminder notifications.
[triggers]
crons = ["* * * * *"]

[observability]
enabled = true
